<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" role="img" aria-label="Цикл событий: одна задача, все микрозадачи, затем, если пора, кадр: requestAnimationFrame, стили, вёрстка, отрисовка">
  <rect width="760" height="312" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8d95"/></marker>
  </defs>

  <!-- рамка кадра -->
  <rect x="24" y="170" width="672" height="100" rx="14" fill="none" stroke="#c9ccd3" stroke-dasharray="4 5"/>
  <text x="40" y="292" font-size="11.5" fill="#8a8d95">кадр: браузер рисует его, когда подошло время, примерно 60 или 120 раз в секунду</text>

  <!-- верхний ряд -->
  <rect x="40" y="50" width="160" height="60" rx="10" fill="#2b55c9" fill-opacity=".1" stroke="#2b55c9"/>
  <text x="120" y="76" text-anchor="middle" font-weight="600" fill="#111214">Одна задача</text>
  <text x="120" y="95" text-anchor="middle" font-size="11.5" fill="#6c6f78">клик, таймер, скрипт</text>

  <rect x="250" y="50" width="180" height="60" rx="10" fill="#2f9e5b" fill-opacity=".1" stroke="#2f9e5b"/>
  <text x="340" y="76" text-anchor="middle" font-weight="600" fill="#111214">Все микрозадачи</text>
  <text x="340" y="95" text-anchor="middle" font-size="11.5" fill="#6c6f78">Promise.then и другие</text>

  <path d="M500 80 L590 34 L680 80 L590 126 Z" fill="#d9822b" fill-opacity=".12" stroke="#d9822b"/>
  <text x="590" y="85" text-anchor="middle" font-weight="600" fill="#111214">Пора рисовать?</text>

  <!-- стрелки верхнего ряда -->
  <g fill="none" stroke="#8a8d95" stroke-width="1.4">
    <path d="M200 80H246" marker-end="url(#a)"/>
    <path d="M430 80H496" marker-end="url(#a)"/>
    <!-- нет: обратно к следующей задаче -->
    <path d="M590 34V14H120V46" marker-end="url(#a)"/>
    <!-- да: вниз в кадр -->
    <path d="M590 126V186" marker-end="url(#a)"/>
  </g>
  <text x="355" y="10" text-anchor="middle" font-size="11.5" fill="#6c6f78" dy="0">нет: берём следующую задачу</text>
  <text x="602" y="160" font-size="11.5" fill="#6c6f78">да</text>

  <!-- нижний ряд: кадр, справа налево -->
  <rect x="500" y="190" width="180" height="60" rx="10" fill="#ff3b5c" fill-opacity=".1" stroke="#ff3b5c"/>
  <text x="590" y="216" text-anchor="middle" font-weight="600" fill="#111214">requestAnimationFrame</text>
  <text x="590" y="235" text-anchor="middle" font-size="11.5" fill="#6c6f78">ваш код перед кадром</text>

  <rect x="360" y="190" width="100" height="60" rx="10" fill="#8a8d95" fill-opacity=".1" stroke="#8a8d95"/>
  <text x="410" y="216" text-anchor="middle" font-weight="600" fill="#111214">Стили</text>
  <text x="410" y="235" text-anchor="middle" font-size="11.5" fill="#6c6f78">пересчёт CSS</text>

  <rect x="220" y="190" width="100" height="60" rx="10" fill="#8a8d95" fill-opacity=".1" stroke="#8a8d95"/>
  <text x="270" y="216" text-anchor="middle" font-weight="600" fill="#111214">Вёрстка</text>
  <text x="270" y="235" text-anchor="middle" font-size="11.5" fill="#6c6f78">размеры</text>

  <rect x="40" y="190" width="140" height="60" rx="10" fill="#8a8d95" fill-opacity=".1" stroke="#8a8d95"/>
  <text x="110" y="216" text-anchor="middle" font-weight="600" fill="#111214">Отрисовка</text>
  <text x="110" y="235" text-anchor="middle" font-size="11.5" fill="#6c6f78">пиксели на экране</text>

  <g fill="none" stroke="#8a8d95" stroke-width="1.4">
    <path d="M500 220H464" marker-end="url(#a)"/>
    <path d="M360 220H324" marker-end="url(#a)"/>
    <path d="M220 220H184" marker-end="url(#a)"/>
    <!-- после кадра снова к задаче -->
    <path d="M110 190V114" marker-end="url(#a)"/>
  </g>
</svg>
