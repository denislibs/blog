<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" role="img" aria-label="transform и opacity пропускают Layout и Paint">
  <rect width="760" height="322" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8d95"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e5484d"/></marker>
  </defs>

  <text x="24" y="30" font-size="15" font-weight="600" fill="#111214">transform и opacity пропускают Layout и Paint</text>

  <!-- стрелки между этапами -->
  <g fill="none" stroke="#8a8d95" stroke-width="1.25">
    <path d="M152 90H176" marker-end="url(#a)"/>
    <path d="M296 90H320" marker-end="url(#a)"/>
    <path d="M440 90H464" marker-end="url(#a)"/>
    <path d="M584 90H608" marker-end="url(#a)"/>
  </g>

  <!-- принудительный reflow: из Layout обратно в JS -->
  <path d="M380 116V146H92V116" fill="none" stroke="#e5484d" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#ab)"/>
  <text x="236" y="166" text-anchor="middle" font-size="11.5" fill="#6c6f78">чтение offsetWidth после записи = принудительный reflow</text>

  <!-- этапы -->
  <g fill="none" stroke="#8a8d95" stroke-width="1.25">
    <rect x="32" y="64" width="120" height="52" rx="8"/>
    <rect x="176" y="64" width="120" height="52" rx="8"/>
    <rect x="320" y="64" width="120" height="52" rx="8"/>
    <rect x="464" y="64" width="120" height="52" rx="8"/>
    <rect x="608" y="64" width="120" height="52" rx="8"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#111214">
    <text x="92" y="86">JavaScript</text>
    <text x="236" y="86">Style</text>
    <text x="380" y="86">Layout</text>
    <text x="524" y="86">Paint</text>
    <text x="668" y="86">Composite</text>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#6c6f78">
    <text x="92" y="104">ваш код</text>
    <text x="236" y="104">пересчёт стилей</text>
    <text x="380" y="104">геометрия</text>
    <text x="524" y="104">пиксели слоёв</text>
    <text x="668" y="104">сборка на GPU</text>
  </g>

  <!-- какие свойства с какого этапа запускают конвейер -->
  <text x="24" y="204" font-size="11.5" fill="#6c6f78">Изменение свойства запускает все этапы от начала цветной полосы до Composite</text>
  <rect x="320" y="222" width="408" height="20" rx="6" fill="#e5484d" fill-opacity=".18" stroke="#e5484d" stroke-width="1.25"/>
  <text x="310" y="236" text-anchor="end" fill="#111214">width, height, top, left, margin</text>
  <rect x="464" y="254" width="264" height="20" rx="6" fill="#d9822b" fill-opacity=".18" stroke="#d9822b" stroke-width="1.25"/>
  <text x="454" y="268" text-anchor="end" fill="#111214">color, background, box-shadow</text>
  <rect x="608" y="286" width="120" height="20" rx="6" fill="#2f9e5b" fill-opacity=".18" stroke="#2f9e5b" stroke-width="1.25"/>
  <text x="598" y="300" text-anchor="end" font-weight="600" fill="#111214">transform, opacity</text>
</svg>
